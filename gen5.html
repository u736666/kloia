<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PARTICLE_ARCHITECT_v14</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ui-bg: #ffffff; --ui-text: #000000; --ui-border: #000000; --canvas-bg: #000000; }
        * { box-sizing: border-box; border-radius: 0 !important; }
        
        body { 
            margin: 0; overflow: hidden; background: var(--canvas-bg); 
            font-family: 'Noto Sans', sans-serif; display: flex; 
            color: #000; font-size: 12px;
        }

        #sidebar { 
            width: 320px; height: 100vh; background: var(--ui-bg); 
            border-right: 1px solid var(--ui-border); padding: 15px; 
            overflow-y: auto; z-index: 100;
        }

        .group { border: 1px solid var(--ui-border); padding: 10px; margin-bottom: 12px; background: #fff; }
        label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; font-weight: 700; }
        label span { font-family: monospace; color: #888; }
        
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; cursor: pointer; height: 20px; }
        input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #000; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 18px; width: 14px; 
            background: #000; border: 1px solid #fff; margin-top: -9px; 
        }

        /* All Color Boxes Identical Size */
        .c-node { position: relative; height: 35px; border: 1px solid #000; overflow: hidden; }
        .c-node input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .p-node { position: relative; height: 35px; border: 1px solid #000; }
        .p-node input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .p-node .del { 
            position: absolute; top: -4px; right: -4px; background: #000; color: #fff; 
            border: none; font-size: 8px; width: 14px; height: 14px; cursor: pointer; 
            font-weight: bold; z-index: 3; display: none; line-height: 14px;
        }
        .p-node:hover .del { display: block; }

        .shape-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .shape-btn { 
            font-size: 18px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: #fff; border: 1px solid #000; cursor: pointer;
        }
        .shape-btn.active { background: #000; color: #fff; }

        button { 
            background: #fff; border: 1px solid #000; color: #000; padding: 10px; 
            cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; 
            width: 100%; margin-bottom: 5px; transition: 0.1s;
        }
        button:hover { background: #000; color: #fff; }
        button.active { background: #000; color: #fff; }
        button.black { background: #000; color: #fff; border: none; }

        .w-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 5px; }
        .w-row input { width: 100%; padding: 5px; border: 1px solid #000; font-size: 11px; text-align: center; }

        #viewport { flex-grow: 1; position: relative; background: #000; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        .info { position: absolute; bottom: 12px; right: 15px; color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <button class="black" style="height: 45px;" onclick="generateTotalReset()">[ GENERATE_NEW_COMPOSITION ]</button>
    <button onclick="undo()">UNDO_STEP (<span id="uCount">0</span>)</button>

    <div class="group">
        <label>Dramatic Clumping <span id="v-clump">50</span></label><input type="range" id="clump" min="1" max="100" value="50">
        <button onclick="updateStructure()" style="font-size:10px; padding:6px; margin-top:5px;">[ UPDATE STRUCTURE ]</button>
        <label style="margin-top:10px">Rotation Y <span id="v-rotY">0°</span></label><input type="range" id="rotY" min="-180" max="180" value="0">
        <label>Rotation X <span id="v-rotX">0°</span></label><input type="range" id="rotX" min="-180" max="180" value="0">
        <label>Zoom <span id="v-zoom">0</span></label><input type="range" id="zoom" min="-800" max="800" value="0">
    </div>

    <div class="group">
        <label>Atmosphere (Fade) <span id="v-depth">100%</span></label>
        <input type="range" id="depth" min="0" max="100" value="100">
        <label>Background Color</label>
        <div class="c-node" id="bgP"><input type="color" id="bgColor" value="#000000" oninput="cfg.bg=this.value; bgP.style.background=this.value; render()"></div>
    </div>

    <div class="group">
        <label><input type="checkbox" id="showLines" checked onchange="render()"> Enable Plexus</label>
        <div class="w-row">
            <input type="number" step="0.1" value="1.5" id="lwF" oninput="cfg.lw.f=+this.value;render()">
            <input type="number" step="0.1" value="0.6" id="lwM" oninput="cfg.lw.m=+this.value;render()">
            <input type="number" step="0.1" value="0.1" id="lwB" oninput="cfg.lw.b=+this.value;render()">
        </div>
        <label style="margin-top:10px">Radius <span id="v-lineDist">60</span></label><input type="range" id="lineDist" min="10" max="250" value="60">
        <label>Line Color</label>
        <div class="c-node" id="lnP"><input type="color" id="lineColor" value="#ffffff" oninput="cfg.lineColor=this.value; lnP.style.background=this.value; render()"></div>
    </div>

    <div class="group">
        <div class="shape-grid">
            <button class="shape-btn active" id="s1" onclick="setShape('circle','fill')">●</button>
            <button class="shape-btn" id="s2" onclick="setShape('circle','stroke')">○</button>
            <button class="shape-btn" id="s3" onclick="setShape('square','fill')">■</button>
            <button class="shape-btn" id="s4" onclick="setShape('square','stroke')">□</button>
        </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
        <button id="modeSpray" class="active" onclick="setMode('spray')">Spray</button>
        <button id="modeErase" onclick="setMode('erase')">Erase</button>
        <button id="modePull" onclick="setMode('pull')">Vortex</button>
        <button id="modePush" onclick="setMode('push')">Push</button>
    </div>

    <div id="palette" class="palette" style="margin-top:15px"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
        <button onclick="addColor()">+ Color</button>
        <button class="black" onclick="syncColors()">Update</button>
    </div>

    <button class="black" style="margin-top:20px; height: 45px;" onclick="export4K()">EXPORT 4K PNG</button>
    <button style="border-color:#ccc; color:#999; margin-top:5px; font-size:10px;" onclick="clearAll()">Clear Canvas</button>
</div>

<div id="viewport">
    <canvas id="canvas"></canvas>
    <div class="info">ARCHITECT_v14 // P_COUNT: <span id="pCount">0</span></div>
</div>

<script>
/** ENGINE **/
const Noise = new function() {
    this.p = new Uint8Array(512); const v = new Uint8Array(256);
    this.init = () => {
        for(let i=0; i<256; i++) v[i]=i;
        for(let i=255; i>0; i--) { let j=Math.floor(Math.random()*(i+1)); [v[i],v[j]]=[v[j],v[i]]; }
        this.p.set(v); this.p.set(v, 256);
    };
    this.get = (x,y) => {
        let X=Math.floor(x)&255, Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y);
        const f=t=>t*t*t*(t*(t*6-15)+10), a=this.p[this.p[X]+Y], b=this.p[this.p[X+1]+Y];
        const g=(h,x,y)=>{h&=15; return ((h<8?x:y)*(h&1?-1:1)+(h<4?y:(h==12||h==14?x:0))*(h&2?-1:1));};
        return (1-f(y))*((1-f(x))*g(a,x,y)+f(x)*g(b,x-1,y)) + f(y)*((1-f(x))*g(this.p[this.p[X]+Y+1],x,y-1)+f(x)*g(this.p[this.p[X+1]+Y+1],x-1,y-1));
    };
}; 

function hToHsl(hex) {
    if(hex.startsWith('hsl')) return parseHsl(hex);
    let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    let max=Math.max(r,g,b), min=Math.min(r,g,b), h, s, l=(max+min)/2;
    if(max==min) h=s=0; else {
        let d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
        switch(max){ case r:h=(g-b)/d+(g<b?6:0);break; case g:h=(b-r)/d+2;break; case b:h=(r-g)/d+4;break; } h/=6;
    } return {h:h*360, s:s*100, l:l*100};
}
function parseHsl(str) { const p = str.match(/\d+/g).map(Number); return {h:p[0], s:p[1], l:p[2]}; }
function hslToHex(h,s,l) {
    l /= 100; const a = s * Math.min(l, 1 - l) / 100;
    const f = n => { const k = (n + h / 30) % 12; const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); return Math.round(255 * color).toString(16).padStart(2, '0'); };
    return `#${f(0)}${f(8)}${f(4)}`;
}

/** STATE **/
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
let particles = [], history = [], mode = 'spray', isDrawing = false, hubs = [];
let palette = ['#58a6ff', '#ffffff', '#aaaaaa'];
const cfg = { rotX:0, rotY:0, zoom:0, depth:1.0, scale:0.004, chaos:100, lineDist:60, lineColor:'#ffffff', shape:'circle', style:'fill', bg:'#000000', lw:{f:1.5, m:0.6, b:0.1}, clump: 50 };

function save() { 
    const snap = { p: particles.map(p => ({...p, hsl: {...p.hsl}})), c: JSON.parse(JSON.stringify(cfg)), pal: [...palette], h: JSON.parse(JSON.stringify(hubs)) };
    history.push(snap); if(history.length > 11) history.shift();
    document.getElementById('uCount').innerText = Math.max(0, history.length - 1);
}

function undo() {
    if(history.length < 2) return; history.pop();
    const prev = history[history.length-1];
    particles = prev.p.map(p => ({...p, hsl: {...p.hsl}})); Object.assign(cfg, prev.c); palette = [...prev.pal]; hubs = [...prev.h];
    syncUI(); updateUI(); render();
}

function syncUI() {
    ['rotX','rotY','zoom','depth','lineDist','clump'].forEach(id => {
        let el = document.getElementById(id);
        el.value = (id==='depth'?cfg[id]*100:cfg[id]);
        document.getElementById('v-'+id).innerText = el.value + (id.includes('rot')?'°':'%');
    });
    document.getElementById('bgP').style.background = cfg.bg; 
    document.getElementById('lnP').style.background = cfg.lineColor;
}

['rotX','rotY','zoom','depth','lineDist','clump'].forEach(id => {
    document.getElementById(id).oninput = (e) => {
        let v = parseFloat(e.target.value);
        if(id==='depth') cfg.depth = v/100; else cfg[id] = v;
        document.getElementById('v-'+id).innerText = e.target.value + (id.includes('rot')?'°':'%');
        render();
    };
    document.getElementById(id).onchange = save;
});

function setShape(sh, st) {
    cfg.shape = sh; cfg.style = st;
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    if(sh==='circle' && st==='fill') document.getElementById('s1').classList.add('active');
    if(sh==='circle' && st==='stroke') document.getElementById('s2').classList.add('active');
    if(sh==='square' && st==='fill') document.getElementById('s3').classList.add('active');
    if(sh==='square' && st==='stroke') document.getElementById('s4').classList.add('active');
    render();
}

function updateUI() {
    const el = document.getElementById('palette'); el.innerHTML = '';
    palette.forEach((c, i) => {
        const div = document.createElement('div'); div.className = 'p-node'; div.style.background = c;
        div.innerHTML = `<input type="color" value="${c}" onchange="palette[${i}]=this.value;updateUI()">
                         <button class="del" onclick="palette.splice(${i},1);updateUI()">X</button>`;
        el.appendChild(div);
    });
}
function addColor() { palette.push('#ffffff'); updateUI(); }
function syncColors() { save(); particles.forEach(p => p.hsl = hToHsl(palette[Math.floor(Math.random()*palette.length)])); render(); }
function clearAll() { save(); particles=[]; hubs=[]; render(); }
function setMode(m) { mode = m; document.querySelectorAll('button').forEach(b=>b.classList.remove('active')); document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active'); }

/** STRUCTURE UPDATE **/
function updateStructure() {
    save();
    const spread = (105 - cfg.clump) * 2.5;
    particles.forEach(p => {
        const hub = hubs[p.hubIdx] || hubs[0];
        // Re-randomize offset around existing hub using new clump factor
        p.ox = (Math.random()-0.5) * spread;
        p.oy = (Math.random()-0.5) * spread;
        p.oz = (Math.random()-0.5) * spread;
        p.x = hub.x + p.ox;
        p.y = hub.y + p.oy;
        p.z = hub.z + p.oz;
    });
    render();
}

function generateTotalReset() {
    save(); particles = []; Noise.init(); 
    cfg.chaos = Math.random() * 300; cfg.scale = (Math.random() * 0.005) + 0.001; cfg.depth = 1.0; 
    const h = Math.random() * 360; palette = [hslToHex(h, 80, 50), hslToHex((h + 40) % 360, 70, 40), "#ffffff"];
    syncUI(); updateUI();
    
    const hubCount = 4 + Math.floor(Math.random() * 6);
    hubs = Array.from({length: hubCount}, () => ({
        x: (Math.random()-0.5)*700, y: (Math.random()-0.5)*700, z: (Math.random()-0.5)*700
    }));

    const spread = (105 - cfg.clump) * 2.5;
    for(let i=0; i<1500; i++) {
        const hIdx = Math.floor(Math.random() * hubCount);
        const hub = hubs[hIdx];
        const ox = (Math.random()-0.5)*spread, oy = (Math.random()-0.5)*spread, oz = (Math.random()-0.5)*spread;
        particles.push({ x: hub.x+ox, y: hub.y+oy, z: hub.z+oz, ox, oy, oz, hubIdx: hIdx, hsl: hToHsl(palette[Math.floor(Math.random()*palette.length)]) });
    }
    render();
}

/** RENDERER **/
function renderTo(t, w, h, scl = 1) {
    t.fillStyle = cfg.bg; t.fillRect(0,0,w,h);
    const rX = cfg.rotX * Math.PI/180, rY = cfg.rotY * Math.PI/180;
    const cosX = Math.cos(rX), sinX = Math.sin(rX), cosY = Math.cos(rY), sinY = Math.sin(rY);
    const lH = hToHsl(cfg.lineColor);
    const fadeExp = (1.1 - cfg.depth) * 8; 

    const projected = particles.map(p => {
        const n = Noise.get(p.x*cfg.scale, p.y*cfg.scale);
        const ox = Math.cos(n*10)*cfg.chaos, oy = Math.sin(n*10)*cfg.chaos;
        let tx = (p.x+ox)*cosY + (p.z)*sinY;
        let tz = -(p.x+ox)*sinY + (p.z)*cosY;
        let ty = (p.y+oy)*cosX - tz*sinX;
        tz = (p.y+oy)*sinX + tz*cosX;
        const worldZ = tz + 800 + cfg.zoom;
        const s = 700 / Math.max(1, worldZ);
        const nZ = Math.min(1, Math.max(0, (worldZ - 200) / 1800));
        return { x: tx*s + w/2, y: ty*s + h/2, z: worldZ, s, hsl: p.hsl, normZ: nZ };
    }).sort((a,b) => b.z - a.z);

    if(document.getElementById('showLines').checked) {
        for(let i=0; i<projected.length; i+=(projected.length>1200?2:1)) {
            const p1 = projected[i];
            for(let j=i+1; j<Math.min(i+35, projected.length); j++) {
                const p2 = projected[j];
                const d = Math.hypot(p1.x-p2.x, p1.y-p2.y);
                const lim = cfg.lineDist * p1.s * scl;
                if(d < lim) {
                    const avgZ = (p1.normZ + p2.normZ) / 2;
                    const alpha = Math.pow(1 - avgZ, fadeExp);
                    let weight = avgZ < 0.5 ? cfg.lw.f + (cfg.lw.m - cfg.lw.f) * (avgZ * 2) : cfg.lw.m + (cfg.lw.b - cfg.lw.m) * ((avgZ - 0.5) * 2);
                    t.lineWidth = weight * scl; t.strokeStyle = `hsla(${lH.h},${lH.s}%,${lH.l}%,${(1-d/lim)*alpha})`;
                    t.beginPath(); t.moveTo(p1.x, p1.y); t.lineTo(p2.x, p2.y); t.stroke();
                }
            }
        }
    }

    projected.forEach(p => {
        const alpha = Math.pow(1 - p.normZ, fadeExp);
        t.fillStyle = t.strokeStyle = `hsla(${p.hsl.h}, ${p.hsl.s*(1-p.normZ*(1-cfg.depth))}%, ${p.hsl.l*(1-p.normZ*(1-cfg.depth))}%, ${Math.max(0.01, alpha)})`;
        const r = (p.hsl.l>90?1.2:2.8) * p.s * scl;
        t.beginPath();
        if(cfg.shape==='circle') { t.arc(p.x, p.y, r, 0, Math.PI*2); if(cfg.style==='fill') t.fill(); else t.stroke(); }
        else { if(cfg.style==='fill') t.fillRect(p.x-r, p.y-r, r*2, r*2); else t.strokeRect(p.x-r, p.y-r, r*2, r*2); }
    });
}

function render() { renderTo(ctx, canvas.width, canvas.height, 1); document.getElementById('pCount').innerText = particles.length; }

function export4K() {
    const e = document.createElement('canvas'); e.width=3840; e.height=2160;
    renderTo(e.getContext('2d'), 3840, 2160, 3);
    const l = document.createElement('a'); l.download='architect_4k.png'; l.href=e.toDataURL(); l.click();
}

/** INTERACTION **/
function handle(mx, my) {
    const rx = (mx - 320) - (canvas.width/2);
    const ry = my - (canvas.height/2);
    if(mode==='spray') {
        for(let i=0; i<15; i++) {
            particles.push({
                x: rx / (700/800) + (Math.random()-0.5)*200, y: ry / (700/800) + (Math.random()-0.5)*200, z: (Math.random()-0.5)*1000,
                hubIdx: 0, hsl: hToHsl(palette[Math.floor(Math.random()*palette.length)])
            });
        }
    } else if(mode==='erase') {
        particles=particles.filter(p => {
            const s = 700 / (800 + p.z + cfg.zoom);
            return Math.hypot(p.x*s + canvas.width/2 - (mx-320), p.y*s + canvas.height/2 - ry) > 80;
        });
    } else {
        const force = mode==='pull' ? 0.05 : -0.05;
        particles.forEach(p => {
            const dx = (rx / (700/800)) - p.x, dy = (ry / (700/800)) - p.y, dz = -p.z;
            const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if(d < 500) { p.x += dx*force*(1-d/500); p.y += dy*force*(1-d/500); p.z += dz*force*(1-d/500); }
        });
    }
    render();
}

canvas.addEventListener('mousedown', e => { isDrawing=true; handle(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', e => { if(isDrawing) handle(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if(isDrawing) { isDrawing=false; save(); } });
window.onresize = () => { canvas.width=window.innerWidth-320; canvas.height=window.innerHeight; render(); };

Noise.init();
canvas.width=window.innerWidth-320; canvas.height=window.innerHeight;
updateUI(); generateTotalReset(); save();
</script>
</body>
</html>
